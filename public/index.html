<!DOCTYPE html>
<html>
<head>
  <title>CoachMyCalls – Deepgram</title>
  <script src="js/deepgram.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const transcriptEl = document.getElementById("transcript");
      const responseEl = document.getElementById("response");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log("🎤 Mic permission granted");

        const deepgram = Deepgram.createClient("560fbffb85966d46411000f0199cd962dce12e9f");

        const connection = await deepgram.listen.live({
          stream,
          model: "nova",
          smart_format: true,
          language: "en-US",
        });

        connection.onTranscriptReceived = async (data) => {
          console.log("📡 Raw transcript event:", data);

          const transcript = data.channel.alternatives?.[0]?.transcript || "";
          if (transcript) {
            console.log("📝 Transcript:", transcript);
            transcriptEl.innerText = transcript;

            try {
              const res = await fetch("https://coachmycalls.onrender.com/vapi-webhook", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ transcript }),
              });
              const coaching = await res.text();
              responseEl.innerText = coaching;
            } catch (err) {
              console.error("Claude error:", err);
            }
          }
        };

        connection.onopen = () => console.log("🔊 Deepgram connected");
        connection.onerror = (e) => console.error("❌ Deepgram error:", e);
        connection.onclose = () => console.log("🔇 Deepgram disconnected");

        await connection.start();
        console.log("🚀 Streaming started");

        // ✅ Manual test transcript after 3 seconds
        setTimeout(() => {
          const fakeData = {
            channel: {
              alternatives: [{ transcript: "This is a test transcript" }]
            }
          };
          connection.onTranscriptReceived?.(fakeData);
        }, 3000);

      } catch (err) {
        console.error("🎤 Mic access denied or error:", err);
        transcriptEl.innerText = "Mic access denied.";
      }
    });
  </script>
</head>
<body>
  <h1>Speak Now</h1>
  <pre id="transcript">Waiting for input...</pre>
  <pre id="response">Your coaching tip will appear here...</pre>
</body>
</html>
